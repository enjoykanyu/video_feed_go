syntax = "proto3";
package user;
option go_package = "internal/proto";  // 完整 Go 导入路径:ml-citation{ref="1,2" data="citationList"}

service UserService {
  rpc Register(UserRequest) returns (Response);
}

message UserRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

message Response {
  int32 code = 1;
  string message = 2;
  uint32 user_id = 3;
}
